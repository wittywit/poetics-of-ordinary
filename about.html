<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — Poetics of Ordinary</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .about-wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 120px 40px 0;
    }

    .about-label {
      font-family: var(--sans);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--orange);
      margin-bottom: 48px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
    }

    .about-label::before {
      content: '';
      display: block;
      width: 24px;
      height: 2px;
      background: var(--fg);
      flex-shrink: 0;
    }

    .about-statement {
      font-family: var(--sans);
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 820px;
      margin-bottom: 60px;
    }

    .about-names {
      display: flex;
      gap: 48px;
      padding-top: 40px;
      border-top: var(--rule);
    }

    .about-name {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: 0.02em;
    }

    @media (max-width: 600px) {
      .about-wrap { padding: 80px 20px 0; }
      .about-names { flex-direction: column; gap: 16px; }
    }
  </style>
</head>
<body class="page-body">

  <nav>
    <a class="nav-brand" href="index.html">Poetics of Ordinary</a>
    <ul class="nav-links">
      <li><a href="about.html" class="active">About</a></li>
    </ul>
    <span class="nav-date" id="nav-date"></span>
  </nav>

  <div class="about-wrap">
    <p class="about-label">About</p>
    <h1 class="about-statement">A documentation practice. Making the familiar strange enough to actually see it.</h1>
    <div class="about-names">
      <span class="about-name">Pranshu Chaudhary</span>
      <span class="about-name">Monalisa Thakur</span>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <span class="footer-left">© 2026 Poetics of Ordinary</span>
      <span class="footer-right">ongoing</span>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('nav-date');
      if (el) el.textContent = new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
    })();
  </script>
</body>
</html>
